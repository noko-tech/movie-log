name: Publish Movie Log to Pages (manual)

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the public file boundary
        run: python3 -B -m unittest discover -s tests/pages -p 'test_*.py' -v

      - name: Build and inspect the public files
        env:
          PAGES_OUTPUT: ${{ runner.temp }}/movie-log-pages
        run: |
          python3 -B scripts/build_pages.py --output "$PAGES_OUTPUT"
          python3 -B scripts/build_pages.py --output "$PAGES_OUTPUT" --verify-only

      - name: Upload only the inspected directory
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/movie-log-pages

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy the inspected artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
