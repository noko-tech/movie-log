name: Publish Movie Log (manual)

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare and inspect the legacy public file
        id: public_files
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tempfile

          source = Path("index.html")
          if source.is_symlink() or not source.is_file() or source.stat().st_size == 0:
              raise SystemExit("index.html must be a non-empty regular file.")

          output = Path(tempfile.mkdtemp(prefix="movie-log-legacy-pages-", dir=os.environ["RUNNER_TEMP"]))
          target = output / "index.html"
          shutil.copyfile(source, target)

          if sorted(entry.name for entry in output.iterdir()) != ["index.html"]:
              raise SystemExit("Unexpected files or directories in the public artifact.")
          if target.is_symlink() or not target.is_file() or target.stat().st_nlink != 1:
              raise SystemExit("The public artifact must contain one regular file without links.")
          if target.read_bytes() != source.read_bytes():
              raise SystemExit("The public index.html differs from the source.")

          print("Public file: index.html")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              result.write(f"path={output}\n")
          PY

      - name: Upload only the inspected directory
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.public_files.outputs.path }}

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy the inspected artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
